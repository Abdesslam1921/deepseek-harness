<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DeepSeek Harness</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#121212] text-white h-screen flex flex-col">
<header class="p-3 border-b border-zinc-800 flex justify-between bg-[#1e1e1e]">
  <b>DeepSeek Harness</b>
  <span id="brainBadge" class="text-xs bg-zinc-700 px-2 py-1 rounded">جاهز</span>
</header>
<div id="chat" class="flex-1 overflow-y-auto p-4 space-y-3"></div>
<div class="p-3 bg-[#1e1e1e] border-t border-zinc-800">
  <textarea id="sys" class="w-full bg-zinc-800 rounded p-2 text-xs mb-2" placeholder="System prompt: انت مساعد لمشروعي..."></textarea>
  <div class="flex gap-2">
    <textarea id="input" class="flex-1 bg-zinc-800 rounded-xl px-4 py-3 text-sm outline-none" placeholder="اكتب هنا..."></textarea>
    <button id="send" class="bg-white text-black rounded-xl px-5 font-bold">↑</button>
  </div>
</div>
<script>
const chat=document.getElementById('chat'), input=document.getElementById('input'), badge=document.getElementById('brainBadge');
let messages=[];
function add(role, text){
  const d=document.createElement('div'); d.className=role==='user'?'flex justify-end':'flex justify-start';
  d.innerHTML=`<div class="${role==='user'?'bg-zinc-700':'bg-zinc-800'} max-w-[85%] rounded-2xl px-4 py-2 text-sm whitespace-pre-wrap">${text}</div>`;
  chat.appendChild(d); chat.scrollTop=chat.scrollHeight;
}
async function send(){
  const t=input.value.trim(); if(!t)return;
  add('user', t); messages.push({role:'user', content:t}); input.value='';
  badge.textContent='⏳ يخمم...'; badge.className='text-xs bg-yellow-600 px-2 py-1 rounded';
  const res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages, systemPrompt:document.getElementById('sys').value})});
  const data=await res.json();
  badge.textContent=data.brain_used||'تم'; badge.className=data.brain_used?.includes('DeepSeek')?'text-xs bg-purple-600 px-2 py-1 rounded':'text-xs bg-green-600 px-2 py-1 rounded';
  if(data.error){add('assistant','خطأ: '+data.error); return;}
  add('assistant', data.choices[0].message.content); messages.push({role:'assistant', content:data.choices[0].message.content});
}
document.getElementById('send').onclick=send;
input.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault(); send();}};
</script>
</body>
</html>
