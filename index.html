<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dual Brain Harness - DeepSeek + Groq</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;font-family:system-ui}
  body{background:#0a0a0a;color:#fff;height:100vh;display:flex;flex-direction:column}
  header{background:#111;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #222}
  .brain-switch{display:flex;gap:8px;background:#1a1a1a;padding:4px;border-radius:20px}
  .brain-btn{padding:6px 14px;border-radius:16px;border:0;cursor:pointer;font-size:13px;background:transparent;color:#888;transition:.2s}
  .brain-btn.active{background:#fff;color:#000;font-weight:700}
  .brain-btn.groq.active{background:#f97316;color:#fff}
  #chat{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:12px}
  .msg{max-width:85%;padding:12px 16px;border-radius:18px;font-size:15px;line-height:1.5}
  .msg.user{align-self:flex-end;background:#fff;color:#000;border-bottom-right-radius:4px}
  .msg.assistant{align-self:flex-start;background:#1e1e1e;color:#e5e5e5;border-bottom-left-radius:4px}
  .msg.assistant.groq{border-left:3px solid #f97316}
  .msg.assistant.deepseek{border-left:3px solid #3b82f6}
  footer{padding:12px;background:#111;border-top:1px solid #222;display:flex;flex-direction:column;gap:8px}
  .keys{display:flex;gap:8px}
  .keys input{flex:1;background:#1a1a1a;border:1px solid #2a2a2a;color:#fff;padding:8px 10px;border-radius:8px;font-size:12px}
  .input-row{display:flex;gap:8px}
  #prompt{flex:1;background:#1e1e1e;border:1px solid #333;color:#fff;padding:12px;border-radius:24px;outline:0}
  #send{background:#fff;color:#000;border:0;padding:0 20px;border-radius:24px;font-weight:700;cursor:pointer}
  small{color:#666;font-size:11px}
</style>
</head>
<body>
<header>
  <b>DeepSeek Harness</b>
  <div class="brain-switch">
    <button id="btn-deepseek" class="brain-btn active deepseek" onclick="setBrain('deepseek')">🧠 DeepSeek</button>
    <button id="btn-groq" class="brain-btn groq" onclick="setBrain('groq')">⚡ Groq Llama 3.3</button>
  </div>
</header>

<div id="chat">
  <div class="msg assistant deepseek">السلام! راني واجد بعقلين:<br><br>🧠 <b>DeepSeek</b> للكود والتحليل العميق<br>⚡ <b>Groq Llama 3.3</b> للسرعة وتحليل الإعلانات<br><br>بدل العقل من الفوق واهدر.</div>
</div>

<footer>
  <div class="keys">
    <input id="deepseekKey" placeholder="sk-... DeepSeek API Key">
    <input id="groqKey" placeholder="gsk_... Groq API Key">
    <button onclick="saveKeys()" style="background:#222;color:#fff;border:1px solid #333;padding:6px 12px;border-radius:8px;cursor:pointer">تم</button>
  </div>
  <small>المفاتيح تتخزن غير في المتصفح تاعك (localStorage) - ما تروح لحتى سيرفر</small>
  <div class="input-row">
    <input id="prompt" placeholder="اكتب هنا... System prompt: انت مساعد لمشروعي..." onkeydown="if(event.key==='Enter')send()">
    <button id="send" onclick="send()">إرسال</button>
  </div>
</footer>

<script>
let currentBrain = localStorage.getItem('brain') || 'deepseek';
let deepseekKey = localStorage.getItem('DEEPSEEK_API_KEY') || '';
let groqKey = localStorage.getItem('GROQ_API_KEY') || '';
document.getElementById('deepseekKey').value = deepseekKey;
document.getElementById('groqKey').value = groqKey;
setBrain(currentBrain);

function saveKeys(){
  deepseekKey = document.getElementById('deepseekKey').value.trim();
  groqKey = document.getElementById('groqKey').value.trim();
  localStorage.setItem('DEEPSEEK_API_KEY', deepseekKey);
  localStorage.setItem('GROQ_API_KEY', groqKey);
  alert('تم حفظ المفاتيح ✅');
}

function setBrain(b){
  currentBrain = b;
  localStorage.setItem('brain', b);
  document.querySelectorAll('.brain-btn').forEach(x=>x.classList.remove('active'));
  document.getElementById('btn-'+b).classList.add('active');
}

async function send(){
  const input = document.getElementById('prompt');
  const text = input.value.trim();
  if(!text) return;
  
  // check keys
  if(currentBrain==='deepseek' && !deepseekKey){ alert('حط DeepSeek API Key الفوق'); return; }
  if(currentBrain==='groq' && !groqKey){ alert('حط Groq API Key الفوق'); return; }

  addMsg(text, 'user');
  input.value = '';
  
  const thinking = addMsg('... يفكر بـ '+(currentBrain==='deepseek'?'DeepSeek':'Groq')+' ...', 'assistant '+currentBrain);

  try{
    let url, key, model, body;
    if(currentBrain==='deepseek'){
      url = 'https://api.deepseek.com/chat/completions';
      key = deepseekKey;
      model = 'deepseek-chat';
    } else {
      url = 'https://api.groq.com/openai/v1/chat/completions';
      key = groqKey;
      model = 'llama-3.3-70b-versatile';
    }

    const res = await fetch(url, {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+key },
      body: JSON.stringify({
        model: model,
        messages: [
          {role:'system', content:'انت مساعد لمشروعي، جاوب بالدارجة الجزائرية، انت خبير تسويق وبرمجة.'},
          {role:'user', content: text}
        ],
        temperature: 0.7
      })
    });

    const data = await res.json();
    if(data.error){ thinking.textContent = 'خطأ: '+(data.error.message || JSON.stringify(data.error)); return; }
    
    const reply = data.choices?.[0]?.message?.content || 'ماكانش رد';
    thinking.textContent = reply;

  }catch(e){
    thinking.textContent = 'خطأ في الاتصال: '+e.message+'\nتأكد من المفتاح والانترنت.';
  }
}

function addMsg(t, cls){
  const chat = document.getElementById('chat');
  const d = document.createElement('div');
  d.className = 'msg '+cls;
  d.textContent = t;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  return d;
}
</script>
</body>
</html>
